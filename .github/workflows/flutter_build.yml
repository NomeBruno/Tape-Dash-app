name: Build Flutter Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Instalar dependências do projeto
        run: flutter pub get

      - name: Compilar APK de Release
        run: flutter build apk --release --android-skip-build-dependency-validation

      - name: Salvar APK como artefato
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: path: build/app/outputs/flutter-apk/app-debug.apk
